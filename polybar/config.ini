
[colors]
background = #0c161b
background-alt = #91cbf9
foreground = #C5C8C6
foreground-alt = #293947
alert = #1580d6

[bar/bar1]
width = 100%
border-left-size = 60
border-right-size = 60
height = 22
radius = 9.0
offset-x = 25%
offset-y = 1%
bottom = true
fixed-center = true
monitor = DP-4
separator = |
font-0 = "MesloLGM Nerd Font Mono:size=10;2"
font-1 = "Font Awesome 7 Free:style=Regular:size=20;4"
font-2 = "MesloLGM Nerd Font Mono:size=20;3"

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator-foreground = ${colors.foreground}


modules-left = i3 music 
modules-center = date
modules-right = pulseaudio memory cpu systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/i3]

type = internal/i3
show-urgent=true

ws-icon-0 = 1;%{T3}  %{T-}
ws-icon-1 = 2;%{T3}  %{T-}
ws-icon-2 = 3;%{T3} 󰨞 %{T-}
ws-icon-3 = 4;%{T3}  %{T-}
ws-icon-4 = 5;%{T3}  %{T-}
ws-icon-5 = 6;%{T3}  %{T-}
ws-icon-default = %{T3}  %{T-}
format = <label-state> 

index-sort = true

label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.foreground-alt}
label-focused-underline = ${colors.background-alt}
label-focused-padding = 1

label-unfocused = %icon%
label-unfocused-underline = ${colors.background}
label-unfocused-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.foreground}
label-empty-padding = 1
label-empy-underline = ${colors.background}

label-visible = %icon%
label-visible-underline = ${colors.background}
lable-visible-padding = 1


[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = %{T3}󰕾 %{T-} 
format-volume-prefix-foreground = ${colors.foreground}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = %{T3}󰖁 %{T-}
label-muted-foreground = ${colors.foreground}

[module/memory]
type = internal/memory
interval = 2
format-prefix =%{T3} %{T-}
format-prefix-foreground = ${colors.foreground}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{T3} %{T-}
format-prefix-foreground = ${colors.foreground}
label = %percentage:2%%


[module/date]
type = internal/date
interval = 1

date =%{A1:~/.config/polybar/toggle-calendar.sh:}%{A}%{T3}%{T-} %d/%m %H:%M

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
